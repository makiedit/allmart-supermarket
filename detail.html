<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allmart - የእቃ ዝርዝር እና ተዛማጅ ምርቶች</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8f9fa; color: #333; padding: 20px; }
    
    .container { max-width: 1000px; margin: 0 auto; }
    
    .back-btn { display: inline-block; background: #6c757d; color: white; text-decoration: none; padding: 8px 15px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; transition: 0.3s; }
    .back-btn:hover { background: #5a6268; }

    .selected-product-box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); display: flex; gap: 30px; align-items: center; margin-bottom: 40px; }
    @media(max-width: 768px) { .selected-product-box { flex-direction: column; text-align: center; } }
    
    .selected-img { width: 280px; height: 220px; object-fit: cover; border-radius: 8px; }
    .selected-info h2 { font-size: 26px; color: #1a252f; margin-bottom: 10px; }
    .selected-price { font-size: 22px; color: #d9534f; font-weight: bold; margin-bottom: 8px; }
    .selected-old-price { font-size: 14px; color: #999; text-decoration: line-through; margin-bottom: 15px; }
    
    .order-now-btn { background: #28a745; color: white; border: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.3s; }
    .order-now-btn:hover { background: #218838; }

    h3 { color: #1a252f; margin-bottom: 20px; font-size: 20px; border-bottom: 2px solid #ddd; padding-bottom: 8px; }
    
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
    .product-card { background: white; border: 1px solid #e1e4e8; border-radius: 10px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.05); transition: 0.3s; text-align: center; padding-bottom: 15px; cursor: pointer; }
    .product-card:hover { transform: translateY(-3px); box-shadow: 0 5px 12px rgba(0,0,0,0.1); }
    
    .product-img { width: 100%; height: 140px; object-fit: cover; margin-bottom: 10px; }
    .product-name { font-size: 16px; font-weight: bold; margin-bottom: 5px; color: #1a252f; padding: 0 10px; }
    .product-price { color: #d9534f; font-weight: bold; font-size: 15px; margin-bottom: 10px; }
    
    .view-rel-btn { background: #1a252f; color: white; border: none; padding: 6px 12px; border-radius: 5px; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block; }
    .view-rel-btn:hover { background: #28a745; }
  </style>
</head>
<body>

  <div class="container">
    <a href="./index.html" class="back-btn">⬅️ ወደ ዋናው ሱቅ ተመለስ</a>

    <div id="main-product-container"></div>

    <h3>🔗 ሌሎች ተዛማጅ (Related) እቃዎች</h3>
    <div class="products-grid" id="related-products-list"></div>
  </div>

  <script src="products.js"></script>
  <script>
    window.onload = function() {
      loadProductDetails();
    };

    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    function loadProductDetails() {
      const productId = parseInt(getQueryParam('id'));
      if (typeof storeProducts === 'undefined') return;

      const savedPrices = JSON.parse(localStorage.getItem('allmart_custom_prices')) || {};
      
      const productsWithPrices = storeProducts.map(p => ({
        ...p,
        price: savedPrices[p.id] !== undefined ? savedPrices[p.id] : p.price
      }));

      const currentProduct = productsWithPrices.find(p => p.id === productId);

      const mainContainer = document.getElementById('main-product-container');
      const relatedContainer = document.getElementById('related-products-list');

      if (!currentProduct) {
        mainContainer.innerHTML = "<p style='color:red;'>እቃው አልተገኘም!</p>";
        return;
      }

      mainContainer.innerHTML = `
        <div class="selected-product-box">
          <img src="${currentProduct.image}" alt="${currentProduct.name}" class="selected-img">
          <div class="selected-info">
            <h2>${currentProduct.name}</h2>
            <div class="selected-price">${currentProduct.price} ብር</div>
            <div class="selected-old-price">${currentProduct.oldPrice} ብር</div>
            <a href="./order.html?id=${currentProduct.id}&name=${encodeURIComponent(currentProduct.name)}&price=${currentProduct.price}" class="order-now-btn">አሁን እዘዝ</a>
          </div>
        </div>
      `;

      const relatedProducts = productsWithPrices.filter(p => 
        p.category === currentProduct.category && p.id !== currentProduct.id
      );

      relatedContainer.innerHTML = "";
      if (relatedProducts.length === 0) {
        relatedContainer.innerHTML = "<p style='color: #777;'>ምንም ተዛማጅ እቃ የለም።</p>";
        return;
      }

      relatedProducts.forEach(rel => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.onclick = function() {
          window.location.href = `./detail.html?id=${rel.id}`;
        };
        card.innerHTML = `
          <img src="${rel.image}" alt="${rel.name}" class="product-img">
          <div class="product-name">${rel.name}</div>
          <div class="product-price">${rel.price} ብር</div>
          <span class="view-rel-btn">ይዩት</span>
        `;
        relatedContainer.appendChild(card);
      });
    }
  </script>
</body>
</html>
