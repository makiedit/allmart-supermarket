<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ትዕዛዝ እና ክፍያ | Allmart Supermarket</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding: 20px; }
        
        .container { max-width: 500px; margin: 30px auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .logo { text-align: center; font-size: 1.8rem; font-weight: 800; color: #16a34a; text-decoration: none; display: block; margin-bottom: 20px; }
        .logo span { color: #dc2626; }

        h2 { margin-bottom: 20px; color: #0f172a; text-align: center; font-size: 1.4rem; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #334155; }
        .form-group input, .form-group textarea { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; }
        
        .total-price { font-size: 1.1rem; font-weight: bold; margin: 15px 0; color: #dc2626; background: #fef2f2; padding: 10px; border-radius: 8px; text-align: center; }

        .btn-submit { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .btn-submit:hover { background: #1d4ed8; }

        /* Payment Section */
        .payment-box { display: none; text-align: center; }
        .bank-details { background: #f1f5f9; padding: 15px; border-radius: 8px; text-align: left; margin: 20px 0; border-left: 4px solid #16a34a; }
        .btn-back { display: inline-block; margin-top: 15px; color: #64748b; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <a href="index.html" class="logo">ALL<span>MART</span></a>

    <div class="container">
        <form id="checkoutForm" onsubmit="processPayment(event)">
            <h2>የትዕዛዝ መረጃ ይሙሉ</h2>

            <div class="form-group">
                <label>የመረጡት እቃ</label>
                <input type="text" id="productName" readonly style="background: #e2e8f0; font-weight: bold;">
            </div>

            <div class="form-group">
                <label>ብዛት (Quantity)</label>
                <input type="number" id="quantity" value="1" min="1" required onchange="calculateTotal()">
            </div>

            <div class="form-group">
                <label>ሙሉ ስም</label>
                <input type="text" id="custName" placeholder="ስምዎን ያስገቡ" required>
            </div>

            <div class="form-group">
                <label>ስልክ ቁጥር</label>
                <input type="tel" id="custPhone" placeholder="09... ወይም 07..." required>
            </div>

            <div class="form-group">
                <label>የማድረሻ አድራሻ</label>
                <textarea id="custAddress" rows="3" placeholder="ክፍለ ከተማ፣ ወረዳ ወይም ልዩ ቦታ" required></textarea>
            </div>

            <div class="total-price" id="totalDisplay">ጠቅላላ ዋጋ፦ 0 ብር</div>

            <button type="submit" class="btn-submit">ወደ ክፍያ ቀጥል ➔</button>
            <div style="text-align: center;"><a href="index.html" class="btn-back">⬅ ወደ እቃዎች ገጽ ተመለስ</a></div>
        </form>

        <div class="payment-box" id="paymentBox">
            <h2 style="color: #16a34a;">✅ ትዕዛዝዎ ተመዝግቧል!</h2>
            <p style="font-size: 0.9rem; color: #475569;">እባክዎን ክፍያውን በታች በተጠቀሱት የክፍያ አማራጮች ይፈጽሙ፦</p>

            <div class="bank-details">
                <p>📱 <strong>Telebirr:</strong> 0911000000 (Allmart)</p>
                <p style="margin-top: 5px;">🏦 <strong>ንግድ ባንክ (CBE):</strong> 100000000000</p>
                <hr style="margin: 10px 0; border: none; border-top: 1px solid #cbd5e1;">
                <p><strong>የተከፋይ መጠን፦</strong> <span id="finalAmount" style="color: #dc2626; font-weight: bold;"></span></p>
            </div>

            <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 15px;">ክፍያውን እንደፈጸሙ የትራንዛክሽን ቁጥሩን በስልክ ያሳውቁን።</p>
            <a href="index.html" class="btn-submit" style="display: block; text-decoration: none;">ወደ ዋናው ገጽ ተመለስ</a>
        </div>
    </div>

    <script>
        // URL ላይ የተላከውን የእቃ ስምና ዋጋ መቀበያ
        const urlParams = new URLSearchParams(window.location.search);
        const itemPrice = parseFloat(urlParams.get('price')) || 0;
        const itemName = urlParams.get('name') || 'እቃ';

        document.getElementById('productName').value = itemName;

        function calculateTotal() {
            const qty = document.getElementById('quantity').value;
            const total = itemPrice * qty;
            document.getElementById('totalDisplay').innerText = `ጠቅላላ ዋጋ፦ ${total.toLocaleString()} ብር`;
        }

        function processPayment(event) {
            event.preventDefault();
            const qty = document.getElementById('quantity').value;
            const total = itemPrice * qty;

            document.getElementById('finalAmount').innerText = `${total.toLocaleString()} ብር`;
            document.getElementById('checkoutForm').style.display = 'none';
            document.getElementById('paymentBox').style.display = 'block';
        }

        calculateTotal();
    </script>
</body>
</html>
