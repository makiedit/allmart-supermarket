    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; line-height: 1.6; }

        nav { background: #ffffff; padding: 15px 20px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 15px rgba(0,0,0,0.08); }

        .cat-card:hover { transform: translateY(-5px); }
        .cat-card img { width: 100%; height: 160px; object-fit: cover; }
        .cat-card h2 { padding: 15px; font-size: 1.2rem; color: #16a34a; }
