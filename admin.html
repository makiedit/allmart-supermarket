<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የባለቤት ማስተዳደሪያ (Admin Orders) - Allmart</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8f9fa; color: #333; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
    h2 { color: #1a252f; margin-bottom: 20px; border-left: 6px solid #28a745; padding-left: 12px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #dee2e6; padding: 12px; text-align: left; font-size: 14px; }
    th { background-color: #1a252f; color: white; }
    tr:nth-child(even) { background-color: #f8f9fa; }
    
    .badge { padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .cbe { background: #d1ecf1; color: #0c5460; }
    .telebirr { background: #fff3cd; color: #856404; }
    .cash { background: #d4edda; color: #155724; }
    
    .refresh-btn { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
    .refresh-btn:hover { background: #218838; }
  </style>
</head>
<body>

  <div class="container">
    <h2>የገቡ ትዕዛዞች ዝርዝር (Admin Dashboard)</h2>
    <button class="refresh-btn" onclick="loadOrders()">🔄 ሪፖርት አድስ (Refresh)</button>
    
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>ቀን/ሰዓት</th>
            <th>የደንበኛ ስም</th>
            <th>ስልክ ቁጥር</th>
            <th>እቃው</th>
            <th>ብዛት</th>
            <th>ጠቅላላ ዋጋ</th>
            <th>አድራሻ</th>
            <th>ክፍያ</th>
          </tr>
        </thead>
        <tbody id="orders-table-body">
          <tr><td colspan='8' style='text-align: center;'>በመጫን ላይ...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const DATABASE_URL = "https://allmart-shop-c5301-default-rtdb.firebaseio.com";

    async function loadOrders() {
      const tbody = document.getElementById('orders-table-body');
      tbody.innerHTML = "<tr><td colspan='8' style='text-align: center;'>በመጫን ላይ...</td></tr>";

      try {
        const response = await fetch(`${DATABASE_URL}/orders.json`);
        const data = await response.json();
        
        tbody.innerHTML = "";

        if (!data) {
          tbody.innerHTML = "<tr><td colspan='8' style='text-align: center; color: #777;'>እስካሁን የተመዘገበ ትዕዛዝ የለም።</td></tr>";
          return;
        }

        Object.keys(data).forEach(key => {
          const order = data[key];
          let paymentClass = 'cash';
          if (order.paymentMethod === 'CBE') paymentClass = 'cbe';
          else if (order.paymentMethod === 'Telebirr') paymentClass.value = 'telebirr';

          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${order.orderDate || '-'}</td>
            <td><b>${order.fullName || 'ስም የሌለው'}</b></td>
            <td>${order.phone || '-'}</td>
            <td>${order.productName || '-'}</td>
            <td>${order.quantity || 1}</td>
            <td style="color: #d9534f; font-weight: bold;">${order.totalPrice || 0} ብር</td>
            <td>${order.address || '-'}</td>
            <td><span class="badge ${paymentClass}">${order.paymentMethod || 'Cash'}</span></td>
          `;
          tbody.appendChild(row);
        });

      } catch (error) {
        console.error("Error:", error);
        tbody.innerHTML = "<tr><td colspan='8' style='text-align: center; color: red;'>ዳታውን ማምጣት አልተቻለም። (የኢንተርኔት ወይም የፋየርቤዝ ሕግ ችግር ሊሆን ይችላል)</td></tr>";
      }
    }

    loadOrders();
  </script>
</body>
</html>
