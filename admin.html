<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የባለቤት ማስተዳደሪያ (Admin Orders) - Allmart</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8f9fa; color: #333; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    /* Login Box Styles */
    #login-container { background: white; width: 100%; max-width: 400px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
    #login-container h2 { color: #1a252f; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; text-align: left; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
    input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; outline: none; text-align: center; letter-spacing: 3px; }
    .login-btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .login-btn:hover { background: #218838; }
    .error-msg { color: #d9534f; font-size: 13px; margin-top: 10px; display: none; }

    /* Admin Dashboard Styles */
    .container { max-width: 1200px; width: 100%; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); display: none; }
    .container h2 { color: #1a252f; margin-bottom: 20px; border-left: 6px solid #28a745; padding-left: 12px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #dee2e6; padding: 12px; text-align: left; font-size: 14px; }
    th { background-color: #1a252f; color: white; }
    tr:nth-child(even) { background-color: #f8f9fa; }
    
    .badge { padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .cbe { background: #d1ecf1; color: #0c5460; }
    .telebirr { background: #fff3cd; color: #856404; }
    .cash { background: #d4edda; color: #155724; }
    
    .top-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .refresh-btn { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .refresh-btn:hover { background: #218838; }
    .logout-btn { background: #dc3545; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .logout-btn:hover { background: #c82333; }
  </style>
</head>
<body>

  <!-- የይለፍ ቃል መጠየቂያ ፕላትፎርም -->
  <div id="login-container">
    <h2>የባለቤት መግቢያ</h2>
    <p style="font-size: 13px; color: #666; margin-bottom: 20px;">እባክዎ የ 8 አሃዝ ምስጢራዊ ቁጥር ያስገቡ</p>
    <div class="form-group">
      <input type="password" id="adminPassword" maxlength="8" placeholder="********">
    </div>
    <button class="login-btn" onclick="checkPassword()">ግባ</button>
    <p id="errorMsg" class="error-msg">የገባው የይለፍ ቃል ስህተት ነው!</p>
  </div>

  <!-- የትዕዛዞች ማስተዳደሪያ ሰንጠረዥ (በመጀመሪያ ተደብቋል) -->
  <div class="container" id="adminDashboard">
    <div class="top-actions">
      <h2>የገቡ ትዕዛዞች ዝርዝር (Admin Dashboard)</h2>
      <div>
        <button class="refresh-btn" onclick="loadOrders()">🔄 አድስ</button>
        <button class="logout-btn" onclick="logout()">ውጣ</button>
      </div>
    </div>
    
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>ቀን/ሰዓት</th>
            <th>የደንበኛ ስም</th>
            <th>ስልክ ቁጥር</th>
            <th>እቃው</th>
            <th>ብዛት</th>
            <th>ጠቅላላ ዋጋ</th>
            <th>አድራሻ</th>
            <th>ክፍያ</th>
          </tr>
        </thead>
        <tbody id="orders-table-body">
          <tr><td colspan='8' style='text-align: center;'>በመጫን ላይ...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const DATABASE_URL = "https://allmart-shop-c5301-default-rtdb.firebaseio.com";
    
    // እዚህ ጋር የፈለጉትን የ 8 አሃዝ ቁጥር ማስቀመጥ ይችላሉ34999543 )
    const CORRECT_PASSWORD = "34999543";

    function checkPassword() {
      const inputPass = document.getElementById('adminPassword').value;
      const errorMsg = document.getElementById('errorMsg');

      if (inputPass === CORRECT_PASSWORD) {
        document.getElementById('login-container').style.display = 'none';
        document.getElementById('adminDashboard').style.display = 'block';
        loadOrders();
      } else {
        errorMsg.style.display = 'block';
        document.getElementById('adminPassword').value = '';
      }
    }

    function logout() {
      document.getElementById('adminDashboard').style.display = 'none';
      document.getElementById('login-container').style.display = 'block';
      document.getElementById('adminPassword').value = '';
      document.getElementById('errorMsg').style.display = 'none';
    }

    async function loadOrders() {
      const tbody = document.getElementById('orders-table-body');
      tbody.innerHTML = "<tr><td colspan='8' style='text-align: center;'>በመጫን ላይ...</td></tr>";

      try {
        const response = await fetch(`${DATABASE_URL}/orders.json`);
        const data = await response.json();
        
        tbody.innerHTML = "";

        if (!data) {
          tbody.innerHTML = "<tr><td colspan='8' style='text-align: center; color: #777;'>እስካሁን የተመዘገበ ትዕዛዝ የለም።</td></tr>";
          return;
        }

        Object.keys(data).forEach(key => {
          const order = data[key];
          let paymentClass = 'cash';
          if (order.paymentMethod === 'CBE') paymentClass = 'cbe';
          else if (order.paymentMethod === 'Telebirr') paymentClass = 'telebirr';

          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${order.orderDate || '-'}</td>
            <td><b>${order.fullName || 'ስም የሌለው'}</b></td>
            <td>${order.phone || '-'}</td>
            <td>${order.productName || '-'}</td>
            <td>${order.quantity || 1}</td>
            <td style="color: #d9534f; font-weight: bold;">${order.totalPrice || 0} ብር</td>
            <td>${order.address || '-'}</td>
            <td><span class="badge ${paymentClass}">${order.paymentMethod || 'Cash'}</span></td>
          `;
          tbody.appendChild(row);
        });

      } catch (error) {
        console.error("Error:", error);
        tbody.innerHTML = "<tr><td colspan='8' style='text-align: center; color: red;'>ዳታውን ማምጣት አልተቻለም።</td></tr>";
      }
    }
  </script>
</body>
</html>
