<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allmart Supermarket - ዋና ገጽ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8f9fa; color: #333; padding: 20px; }
    
    header { text-align: center; margin-bottom: 25px; background: #1a252f; color: white; padding: 25px; border-radius: 10px; }
    header h1 { font-size: 28px; margin-bottom: 5px; }
    header p { font-size: 14px; color: #aaa; }

    .container { max-width: 1200px; margin: 0 auto; }

    /* የ ምድብ (Category) አዝራሮች ዲዛይን */
    .category-filter { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
    .filter-btn { background: white; border: 2px solid #28a745; color: #28a745; padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px; }
    .filter-btn:hover, .filter-btn.active { background: #28a745; color: white; }

    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
    
    .product-card { background: white; border: 1px solid #e1e4e8; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
    
    .product-img { width: 100%; height: 160px; object-fit: cover; }
    .product-info { padding: 15px; text-align: center; }
    .product-name { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #1a252f; }
    .product-price { color: #d9534f; font-weight: bold; font-size: 16px; margin-bottom: 12px; }
    
    .buy-btn { background: #28a745; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.3s; }
    .buy-btn:hover { background: #218838; }

    .admin-link { display: block; text-align: center; margin-top: 40px; color: #666; font-size: 13px; text-decoration: none; }
    .admin-link:hover { color: #28a745; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Allmart Supermarket</h1>
      <p>ጥራት ያላቸው እቃዎች በአጭር ጊዜ ውስጥ ቤተሰዎ ዘንድ ይደርሳሉ</p>
    </header>

    <!-- የምድብ (Category) ምርጫ አዝራሮች -->
    <div class="category-filter">
      <button class="filter-btn active" onclick="filterProducts('all', this)">ሁሉም እቃዎች (All)</button>
      <button class="filter-btn" onclick="filterProducts('cosmetics', this)">💄 ኮስሞቲክስ (Cosmetics)</button>
      <button class="filter-btn" onclick="filterProducts('food', this)">🍎 የምግብ እቃዎች (Foods)</button>
      <button class="filter-btn" onclick="filterProducts('household', this)">🧹 የቤት ውስጥ ማጽጃዎች (Household)</button>
    </div>

    <div class="products-grid" id="product-list">
      <!-- እቃዎች በጃቫስክሪፕት በራሳቸው እዚህ ይሞላሉ -->
    </div>

    <a href="admin.html" class="admin-link">⚙️ ለአስተዳዳሪ (Admin Panel) መግቢያ</a>
  </div>

  <!-- የዋጋ ማስተካከያ ፋይሉን መጥራት -->
  <script src="products.js"></script>

  <script>
    const container = document.getElementById('product-list');

    // እቃዎችን በገጹ ላይ የማሳያ ተግባር
    function displayProducts(productsToDisplay) {
      container.innerHTML = "";
      
      if (productsToDisplay.length === 0) {
        container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #777;'> በዚህ ምድብ ስር ምንም እቃዎች የሉም።</p>";
        return;
      }

      productsToDisplay.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${product.image}" alt="${product.name}" class="product-img">
          <div class="product-info">
            <div class="product-name">${product.name}</div>
            <div class="product-price">${product.price} ብር</div>
            <a href="order.html?name=${encodeURIComponent(product.name)}&price=${product.price}" class="buy-btn">እዘዝ</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // ምድብ ሲመረጥ እቃዎችን ማጣሪያ (Filter) የሚያደርግ ሎጂክ
    function filterProducts(category, buttonElement) {
      // የአዝራሮቹን active ስታይል ማስተካከል
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      buttonElement.classList.add('active');

      if (category === 'all') {
        displayProducts(storeProducts);
      } else {
        const filtered = storeProducts.filter(p => p.category === category);
        displayProducts(filtered);
      }
    }

    // ገጹ ሲከፈት የመጀመሪያውን (ሁሉም እቃዎች) ማሳየት
    displayProducts(storeProducts);
  </script>
</body>
</html>
