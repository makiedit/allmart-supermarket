<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maki Online Store | ዘመናዊ የዕቃ መሸጫ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; line-height: 1.6; }

        /* Nav Bar */
        nav { background: #0f172a; padding: 15px 20px; position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #00fff0; font-size: 1.4rem; font-weight: bold; text-decoration: none; }

        /* Header */
        header { background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; padding: 40px 20px; text-align: center; }
        header h1 { font-size: 2.2rem; margin-bottom: 8px; color: #00fff0; }

        /* Filter & Search Bar */
        .controls { max-width: 1000px; margin: -25px auto 20px auto; background: #fff; padding: 15px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; gap: 15px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
        .search-box { flex: 1; min-width: 200px; }
        .search-box input { width: 100%; padding: 10px 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; outline: none; }
        .filter-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 16px; border: none; background: #e0e0e0; border-radius: 20px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .filter-btn.active, .filter-btn:hover { background: #0088cc; color: white; }

        /* Grid Section */
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }

        /* Card Layout */
        .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08); transition: transform 0.3s; display: flex; flex-direction: column; justify-content: space-between; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-content { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-category { font-size: 0.75rem; text-transform: uppercase; color: #888; font-weight: bold; margin-bottom: 5px; }
        .card-title { font-size: 1.1rem; margin-bottom: 8px; color: #1a1a2e; }
        .price { font-size: 1.2rem; font-weight: bold; color: #e94560; margin-bottom: 12px; }

        .btn-order { display: block; width: 100%; background: #0088cc; color: white; text-align: center; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .btn-order:hover { background: #006699; }

        footer { text-align: center; padding: 20px; background: #0f172a; color: #fff; margin-top: 50px; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="#" class="logo">Maki Store</a>
        </div>
    </nav>

    <header>
        <h1>Maki Online Shop</h1>
        <p>ጥራት ያላቸውን የቤት እቃዎች እና ኤሌክትሮኒክስ ያግኙ!</p>
    </header>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" onkeyup="renderProducts()" placeholder="ዕቃ በስም ፈልግ...">
        </div>
        <div class="filter-buttons">
            <button class="filter-btn active" onclick="filterCategory('all', this)">ሁሉንም</button>
            <button class="filter-btn" onclick="filterCategory('electronics', this)">ኤሌክትሮኒክስ</button>
            <button class="filter-btn" onclick="filterCategory('home', this)">የቤት እቃዎች</button>
        </div>
    </div>

    <div class="container">
        <div class="grid" id="productGrid"></div>
    </div>

    <footer>
        <p>&copy; 2026 Maki Online Shop. All rights reserved.</p>
    </footer>

    <script>
        // የቴሌግራም አድራሻህን እዚህ ጋር ቀይረው
        const telegramUsername = "yourusername";

        // ሁሉም እቃዎች የሚመዘገቡበት ዝርዝር (Array)
        const products = [
            // ኤሌክትሮኒክስ (Electronics)
            { id: 1, category: 'electronics', name: 'ስማርት ሰዓት (Smart Watch)', price: '3,200 ብር', img: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500' },
            { id: 2, category: 'electronics', name: 'የገመድ አልባ ኤርፎን (Airpods)', price: '1,800 ብር', img: 'https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=500' },
            { id: 3, category: 'electronics', name: 'ብሉቱዝ ስፒከር (Bluetooth Speaker)', price: '2,800 ብር', img: 'https://images.unsplash.com/photo-1545454675-3531b543be5d?w=500' },
            { id: 4, category: 'electronics', name: 'ፓወር ባንክ 20000mAh (Power Bank)', price: '2,200 ብር', img: 'https://images.unsplash.com/photo-1609592424109-dd9892f1b177?w=500' },
            { id: 5, category: 'electronics', name: 'ስማርት ቲቪ 43 ኢንች (Smart TV)', price: '38,000 ብር', img: 'https://images.unsplash.com/photo-1593784991095-a205069470b6?w=500' },

            // የቤት እቃዎች (Home Appliances)
            { id: 6, category: 'home', name: 'ዘመናዊ የክትፎ/የምግብ እቃ Set', price: '2,500 ብር', img: 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=500' },
            { id: 7, category: 'home', name: 'የቡና ማፍያ ማሽን (Coffee Maker)', price: '4,500 ብር', img: 'https://images.unsplash.com/photo-1517668808822-9ebb02f2a0e6?w=500' },
            { id: 8, category: 'home', name: 'ብሌንደር/ፈጫጭ (Electric Blender)', price: '3,600 ብር', img: 'https://images.unsplash.com/photo-1570222094114-d054a817e56b?w=500' },
            { id: 9, category: 'home', name: 'ኤሌክትሪክ ፍሪጅ (Refrigerator)', price: '45,000 ብር', img: 'https://images.unsplash.com/photo-1571175443880-49e1d25b2bc5?w=500' },
            { id: 10, category: 'home', name: 'የልብስ ማጠቢያ ማሽን (Washing Machine)', price: '52,000 ብር', img: 'https://images.unsplash.com/photo-1626806787461-102c1bfaaea1?w=500' },
            { id: 11, category: 'home', name: 'የማይክሮዌቭ ኦቨን (Microwave Oven)', price: '12,500 ብር', img: 'https://images.unsplash.com/photo-1585659722983-3a675dabf23d?w=500' }
        ];

        let selectedCategory = 'all';

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const searchInput = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = products.filter(item => {
                const matchesCategory = selectedCategory === 'all' || item.category === selectedCategory;
                const matchesSearch = item.name.toLowerCase().includes(searchInput);
                return matchesCategory && matchesSearch;
            });

            filtered.forEach(item => {
                const catName = item.category === 'electronics' ? 'ኤሌክትሮኒክስ' : 'የቤት እቃዎች';
                const telegramLink = `https://t.me/${telegramUsername}?text=${encodeURIComponent('ሰላም ' + item.name + ' ማዘዝ እፈልጋለሁ')}`;
                
                grid.innerHTML += `
                    <div class="card">
                        <img src="${item.img}" alt="${item.name}">
                        <div class="card-content">
                            <div>
                                <div class="card-category">${catName}</div>
                                <h3 class="card-title">${item.name}</h3>
                                <div class="price">${item.price}</div>
                            </div>
                            <a href="${telegramLink}" target="_blank" class="btn-order">በ Telegram እዘዝ</a>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat, element) {
            selectedCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            renderProducts();
        }

        // የመጀመሪያ ገጽ ሲከፈት እቃዎችን ያሳያል
        renderProducts();
    </script>
</body>
</html>
