<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allmart Supermarket</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #333;
    }

    /* Hero Section (በትልቁ የሱፐርማርኬት ምስል እና ስም) */
    .hero-section {
      position: relative;
      width: 100%;
      height: 320px;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                  url('https://images.unsplash.com/photo-1578916171728-46686eac8d58?w=1200') no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 0 20px;
    }

    .hero-title {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 10px;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
    }

    .hero-title span {
      color: #28a745;
    }

    .hero-subtitle {
      font-size: 18px;
      font-weight: 300;
      opacity: 0.9;
    }

    /* Categories Menu */
    .category-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 30px 5% 15px 5%;
      flex-wrap: wrap;
    }

    .cat-btn {
      padding: 10px 24px;
      border: 2px solid #28a745;
      background: white;
      color: #28a745;
      font-size: 16px;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .cat-btn:hover, .cat-btn.active {
      background: #28a745;
      color: white;
      box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
    }

    /* Main Container & Grid */
    main {
      padding: 20px 5% 50px 5%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
    }

    /* Product Cards */
    .product-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: #eee;
    }

    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .product-title {
      font-size: 16px;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 18px;
      color: #28a745;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .order-btn {
      width: 100%;
      padding: 10px;
      border: none;
      background: #1a252f;
      color: white;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .order-btn:hover {
      background: #28a745;
    }

    .loading-text, .empty-text {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      font-size: 18px;
      color: #7f8c8d;
    }
  </style>
</head>
<body>

  <!-- Hero Section with Background Image and Large Title -->
  <header class="hero-section">
    <h1 class="hero-title">ALLMART <span>SUPERMARKET</span></h1>
    <p class="hero-subtitle">የሚፈልጉትን ማንኛውንም እቃ በጥራት እና በቅናሽ ያግኙ!</p>
  </header>

  <!-- Categories Navigation -->
  <div class="category-container">
    <button class="cat-btn active" onclick="filterCategory('all', this)">ሁሉንም</button>
    <button class="cat-btn" onclick="filterCategory('ምግብና መጠጥ', this)">ምግብና መጠጥ</button>
    <button class="cat-btn" onclick="filterCategory('cosmetics', this)">ኮስሞቲክስ</button>
  </div>

  <!-- Products Showcase -->
  <main>
    <div id="product-list" class="product-grid">
      <div class="loading-text">እቃዎች እየጫኑ ነው... እባክዎ ይጠብቁ</div>
    </div>
  </main>

  <!-- JavaScript Code -->
  <script>
    const DATABASE_URL = "https://allmart-shop-c5301-default-rtdb.firebaseio.com";
    let allProducts = [];
    let selectedCategory = 'all';

    async function fetchProducts() {
      const container = document.getElementById('product-list');
      try {
        const response = await fetch(`${DATABASE_URL}/.json`);
        const data = await response.json();

        if (!data) {
          container.innerHTML = `<div class="empty-text">ምንም እቃ አልተገኘም።</div>`;
          return;
        }

        let rawProducts = Array.isArray(data) ? data : Object.values(data);
        
        // ባዶ የሆኑ (እውነተኛ ያልሆኑ) መረጃዎችን ማጣሪያ
        allProducts = rawProducts.filter(item => {
          return item && typeof item === 'object' && (item.name || item.price);
        });

        renderProducts();
      } catch (error) {
        console.error("Error fetching products:", error);
        container.innerHTML = `<div class="empty-text">መረጃውን መጫን አልተቻለም። እባክዎ ኢንተርኔትዎን ያረጋግጡ።</div>`;
      }
    }

    function renderProducts() {
      const container = document.getElementById('product-list');
      container.innerHTML = "";

      const filtered = allProducts.filter(item => {
        if (selectedCategory === 'all') return true;
        if (!item.category) return false;

        const cat = item.category.trim().toLowerCase();
        const selected = selectedCategory.trim().toLowerCase();

        // cosmetics እና cosmotics ሁለቱንም እንዲቀበል ተደርጓል
        if (selected === 'cosmetics' && (cat === 'cosmetics' || cat === 'cosmotics')) {
          return true;
        }

        return cat === selected;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-text">በዚህ ካቴጎሪ ምንም እቃ አልተገኘም።</div>`;
        return;
      }

      filtered.forEach(product => {
        const title = product.name || 'ስም ያልተጠቀሰ እቃ';
        const price = product.price ? `${product.price} ብር` : 'ያልተወሰነ';
        const image = (product.image && product.image.trim() !== '') 
          ? product.image 
          : 'https://via.placeholder.com/300x200?text=No+Image';

        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${image}" alt="${title}" onerror="this.src='https://via.placeholder.com/300x200?text=Image+Error'">
          <div class="card-body">
            <div class="product-title">${title}</div>
            <div class="product-price">${price}</div>
            <button class="order-btn" onclick="goToCheckout('${encodeURIComponent(title)}', '${product.price || 0}')">እዘዝ</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterCategory(cat, element) {
      selectedCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      if (element) element.classList.add('active');
      renderProducts();
    }

    function goToCheckout(name, price) {
      window.location.href = `order.html?name=${name}&price=${price}`;
    }

    document.addEventListener("DOMContentLoaded", fetchProducts);
  </script>
</body>
</html>
