<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allmart Supermarket</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
    .category-container { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
    .cat-btn { padding: 10px 15px; border: none; background: #007bff; color: white; cursor: pointer; border-radius: 5px; }
    .cat-btn.active { background: #0056b3; font-weight: bold; }
    .product-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
    .product-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .product-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 5px; }
    .price { color: green; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Allmart Supermarket</h2>

  <!-- ካቴጎሪ መምረጫ አዝራሮች -->
  <div class="category-container">
    <button class="cat-btn active" onclick="filterCategory('all', this)">ሁሉንም</button>
    <button class="cat-btn" onclick="filterCategory('ምግብና መጥጥ', this)">ምግብና መጠጥ</button>
    <button class="cat-btn" onclick="filterCategory('cosmetics', this)">ኮስሞቲክስ</button>
  </div>

  <!-- እቃዎች የሚታዩበት ቦታ -->
  <div id="product-list" class="product-list">
    <p>እቃዎች እየጫኑ ነው...</p>
  </div>

  <script>
    const DATABASE_URL = "https://allmart-shop-c5301-default-rtdb.firebaseio.com";
    let allProducts = [];
    let selectedCategory = 'all';

    async function fetchProducts() {
      try {
        const response = await fetch(`${DATABASE_URL}/.json`);
        const data = await response.json();

        if (!data) {
          document.getElementById('product-list').innerHTML = "<p>ምንም እቃ አልተገኘም።</p>";
          return;
        }

        allProducts = Array.isArray(data) ? data : Object.values(data);
        renderProducts();
      } catch (error) {
        console.error("Data error:", error);
        document.getElementById('product-list').innerHTML = "<p>መረጃውን መጫን አልተቻለም።</p>";
      }
    }

    function renderProducts() {
      const container = document.getElementById('product-list');
      container.innerHTML = "";

      const filtered = allProducts.filter(item => {
        if (!item) return false;
        if (selectedCategory === 'all') return true;
        
        // በካቴጎሪ ፊደል ልዩነት ምክንያት እንዳይበላሽ Case-insensitive ያደርገዋል
        return item.category && item.category.trim().toLowerCase() === selectedCategory.trim().toLowerCase();
      });

      if (filtered.length === 0) {
        container.innerHTML = "<p>በዚህ ካቴጎሪ ምንም እቃ የለም።</p>";
        return;
      }

      filtered.forEach(product => {
        const imageSrc = product.image && product.image.trim() !== "" ? product.image : 'https://via.placeholder.com/150';

        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${imageSrc}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/150'">
          <h3>${product.name || 'ስም የለውም'}</h3>
          <p class="price">${product.price || 0} ብር</p>
        `;
        container.appendChild(card);
      });
    }

    function filterCategory(cat, element) {
      selectedCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      if (element) element.classList.add('active');
      renderProducts();
    }

    // ገጹ ሲከፈት ዳታ እንዲያመጣ ማድረግ
    document.addEventListener("DOMContentLoaded", fetchProducts);
  </script>
</body>
</html>
