<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allmart Supermarket | ኦልማርት ሱፐርማርኬት</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; line-height: 1.6; }

        /* Top Bar & Navigation */
        .top-bar { background: #0f172a; color: #fff; padding: 8px 20px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
        nav { background: #ffffff; padding: 15px 20px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 15px rgba(0,0,0,0.08); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.8rem; font-weight: 800; color: #16a34a; text-decoration: none; }
        .logo span { color: #dc2626; }

        /* Hero Banner (በትልቁ የሚታየው የሱፐርማርኬት ፎቶና ስም) */
        .hero {
            background: linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.65)), 
                        url('https://images.unsplash.com/photo-1578916171728-46686eac8d58?w=1200') center/cover no-repeat;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
            margin-bottom: 20px;
        }
        .hero h1 { font-size: 2.8rem; font-weight: 800; margin-bottom: 8px; text-shadow: 2px 2px 8px rgba(0,0,0,0.6); }
        .hero p { font-size: 1.1rem; color: #e2e8f0; max-width: 600px; }

        /* Controls & Product Grid */
        .controls { max-width: 1200px; margin: 10px auto; padding: 0 15px; }
        .search-box input { width: 100%; max-width: 600px; display: block; margin: 0 auto 15px auto; padding: 12px 18px; border: 2px solid #e2e8f0; border-radius: 30px; font-size: 0.95rem; outline: none; }
        .category-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
        .cat-btn { padding: 8px 16px; border: 1px solid #cbd5e1; background: #fff; border-radius: 20px; cursor: pointer; font-weight: 600; white-space: nowrap; }
        .cat-btn.active { background: #16a34a; color: white; border-color: #16a34a; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }

        /* Cards */
        .card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #f1f5f9; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-content { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
        .price { font-size: 1.15rem; font-weight: 800; color: #0f172a; margin-bottom: 10px; }
        .btn-order { width: 100%; background: #16a34a; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .btn-order:hover { background: #15803d; }

        /* Mobile Responsiveness (የስልክ ማስተካከያ) */
        @media (max-width: 600px) {
            .hero { height: 200px; }
            .hero h1 { font-size: 1.8rem; }
            .hero p { font-size: 0.9rem; }
            .grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)) !important; gap: 12px !important; }
            .category-scroll { display: flex !important; overflow-x: auto !important; white-space: nowrap !important; padding-bottom: 8px !important; }
            .card-title { font-size: 0.9rem !important; }
        }

        footer { text-align: center; padding: 25px; background: #0f172a; color: #94a3b8; margin-top: 40px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>📍 ALLMART Supermarket Ethiopia</div>
        <div>📞 +251 911 000 000</div>
    </div>

  <nav>
    <div class="nav-container">
        <a href="index.html" class="logo">ALL<span>MART</span></a>
        <div class="nav-links">
            <a href="index.html" style="color: #16a34a; font-weight: bold; text-decoration: none; margin-left: 15px;">ዋና ገፅ</a>
            <a href="categories.html" style="color: #334155; font-weight: 600; text-decoration: none; margin-left: 15px;">የእቃ አይነቶች</a>
            <a href="about.html" style="color: #334155; font-weight: 600; text-decoration: none; margin-left: 15px;">ስለ እኛ</a>
            <a href="location.html" style="color: #334155; font-weight: 600; text-decoration: none; margin-left: 15px;">መገኛ ቦታ</a>
        </div>
    </div>
</nav>

    <!-- የሱፐርማርኬቱ በትልቁ የሚታይ ባነር -->
    <header class="hero">
        <h1>ALLMART SUPERMARKET</h1>
        <p>የሚፈልጉትን ማንኛውንም የቤት ውስጥ ምርቶች በጥራት እና በቅናሽ ዋጋ እዚህ ያገኛሉ!</p>
    </header>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" onkeyup="renderProducts()" placeholder="የሚፈልጉትን እቃ በስም ይፈልጉ...">
        </div>
        <div class="category-scroll">
            <button class="cat-btn active" onclick="filterCategory('all', this)">ሁሉንም</button>
            <button class="cat-btn" onclick="filterCategory('food', this)">ምግብ እና መጠጥ</button>
            <button class="cat-btn" onclick="filterCategory('cosmetics', this)">ኮስሞቲክስ</button>
            <button class="cat-btn" onclick="filterCategory('appliances', this)">የቤት መገልገያ</button>
            <button class="cat-btn" onclick="filterCategory('toys', this)">የህፃናት መጫወቻዎች</button>
        </div>
    </div>

    <div class="container">
        <div class="grid" id="productGrid"></div>
    </div>

    <footer>
        <p>&copy; Allmart Supermarket Ethiopia. All rights reserved.</p>
    </footer>

  <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // YOUR FIREBASE CONFIGURATION HERE
        const firebaseConfig = {
    apiKey: "AIzaSyBVvJZ9VP-lOvzFPbwx_M57VzkLG6G_E0c",
    authDomain: "allmart-shop-c5301.firebaseapp.com",
    databaseURL: "https://allmart-shop-c5301-default-rtdb.firebaseio.com",
    projectId: "allmart-shop-c5301",
    storageBucket: "allmart-shop-c5301.firebasestorage.app",
    messagingSenderId: "623247361737",
    appId: "1:623247361737:web:64589886d52d79e81d2f18"
  };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let products = [];
        const urlParams = new URLSearchParams(window.location.search);
        let selectedCategory = urlParams.get('cat') || 'all';
        let selectedSubcategory = urlParams.get('sub') || 'all';

        // እቃዎችን ከ Firebase በቅጽበት መሳቢያ (Realtime Fetch)
        db.ref('products').on('value', (snapshot) => {
            const data = snapshot.val();
            products = [];
            for (let id in data) {
                products.push(data[id]);
            }
            renderProducts();
        });

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const searchInput = document.getElementById('searchInput') ? document.getElementById('searchInput').value.toLowerCase() : '';
            grid.innerHTML = '';

            const filtered = products.filter(item => {
                const matchesCat = (selectedCategory === 'all' || item.category === selectedCategory);
                const matchesSub = (selectedSubcategory === 'all' || item.subcategory === selectedSubcategory);
                const matchesSearch = item.name.toLowerCase().includes(searchInput);
                return matchesCat && matchesSub && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748b;">ምንም የተገኘ እቃ የለም።</p>';
                return;
            }

            filtered.forEach(item => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${item.img}" alt="${item.name}">
                        <div class="card-content">
                            <div>
                                <h3 class="card-title">${item.name}</h3>
                                <div class="price">${Number(item.price).toLocaleString()} ብር</div>
                            </div>
                            <button class="btn-order" onclick="goToCheckout('${item.name}', ${item.price})">እዘዝ</button>
                        </div>
                    </div>
                `;
            });
        }

        function goToCheckout(name, price) {
            window.location.href = `order.html?name=${encodeURIComponent(name)}&price=${price}`;
        }

       function filterCategory(cat, element) {
  selectedCategory = cat;
  selectedSubcategory = 'all';

  // የነበሩትን አዝራሮች active class ማንሳት
  document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));

  // አሁን የተጫነውን አዝራር active ማድረግ
  if (element) {
    element.classList.add('active');
  }

  // እቃዎቹን ድጋሚ ማሳየት
  renderProducts();
}
    </script>
</body>
</html>
