<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>እቃ ማዘዣ - Allmart Supermarket</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8f9fa; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .order-container { background: white; width: 100%; max-width: 500px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { color: #1a252f; margin-bottom: 20px; text-align: center; font-size: 24px; border-bottom: 3px solid #28a745; padding-bottom: 10px; }
    
    .summary-box { background: #f1f8f5; padding: 15px; border-radius: 8px; border: 1px solid #d4edda; margin-bottom: 20px; }
    .summary-box p { font-size: 15px; margin-bottom: 8px; }
    .summary-box span { font-weight: bold; color: #28a745; }
    .total-price { font-size: 18px !important; color: #d9534f !important; border-top: 1px dashed #d4edda; padding-top: 8px; margin-top: 8px; }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #444; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; transition: 0.3s; }
    input:focus, select:focus, textarea:focus { border-color: #28a745; box-shadow: 0 0 5px rgba(40,167,69,0.2); }

    .submit-btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    .submit-btn:hover { background: #218838; }

    #payment-details { display: none; margin-top: 10px; padding: 12px; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 6px; font-size: 13px; color: #856404; }
    #trx-group { display: none; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="order-container">
    <h2>የግዢ ማረጋገጫ</h2>
    
    <div class="summary-box">
      <p>የተመረጠው እቃ: <span id="product-name">--</span></p>
      <p>የአንዱ ዋጋ: <span id="unit-price">0</span> ብር</p>
      <p class="total-price">ጠቅላላ የሚከፈለው: <span id="total-price">0</span> ብር</p>
    </div>

    <form id="orderForm">
      <div class="form-group">
        <label for="quantity">የእቃ ብዛት (Quantity)</label>
        <input type="number" id="quantity" value="1" min="1" required oninput="calculateTotal()">
      </div>

      <div class="form-group">
        <label for="fullName">ሙሉ ስምዎ</label>
        <input type="text" id="fullName" required placeholder="እባክዎ ስምዎን ያስገቡ">
      </div>

      <div class="form-group">
        <label for="phone">ስልክ ቁጥር</label>
        <input type="tel" id="phone" required placeholder="09xxxxxxxx">
      </div>

      <div class="form-group">
        <label for="address">የመላኪያ አድራሻ (ክፍለ ከተማ / ቀበሌ / የቤት ቁጥር)</label>
        <textarea id="address" rows="2" required placeholder="አድራሻዎን በግልጽ ይጻፉ"></textarea>
      </div>

      <div class="form-group">
        <label for="paymentMethod">የክፍያ አማራጭ ይምረጡ</label>
        <select id="paymentMethod" required onchange="showPaymentInfo(this.value)">
          <option value="">-- ክፍያ የሚፈጽሙበትን መንገድ ይምረጡ --</option>
          <option value="CBE">ንግድ ባንክ (CBE Transfer)</option>
          <option value="Telebirr">ቴሌብር (Telebirr)</option>
          <option value="Cash">እቃው ሲደርሰን በጥሬ ገንዘብ (Cash on Delivery)</option>
        </select>
        
        <div id="payment-details"></div>

        <div class="form-group" id="trx-group">
          <label for="transactionId" style="margin-top: 10px; color: #d9534f;">የክፍያ ማረጋገጫ ቁጥር (Transaction ID)</label>
          <input type="text" id="transactionId" placeholder="ትክክለኛውን የትራንዛክሽን ቁጥር ያስገቡ">
          <small style="color: #666; font-size: 11px;">* የባንክ ወይም የቴሌብር ትክክለኛ የረጅም ቁጥር መሆን አለበት (ቢያንስ 8 ፊደል/ቁጥር)</small>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">ትዕዛዙን ይላኩ</button>
    </form>
  </div>

  <script>
    const DATABASE_URL = "https://allmart-shop-c5301-default-rtdb.firebaseio.com";

    const urlParams = new URLSearchParams(window.location.search);
    const productName = urlParams.get('name') ? decodeURIComponent(urlParams.get('name')) : "ያልታወቀ እቃ";
    const unitPrice = parseFloat(urlParams.get('price')) || 0;

    if (productName && unitPrice) {
      document.getElementById('product-name').innerText = productName;
      document.getElementById('unit-price').innerText = unitPrice;
      document.getElementById('total-price').innerText = unitPrice;
    }

    function calculateTotal() {
      const qty = parseInt(document.getElementById('quantity').value) || 1;
      const total = unitPrice * qty;
      document.getElementById('total-price').innerText = total;
    }

    function showPaymentInfo(method) {
      const detailsBox = document.getElementById('payment-details');
      const trxGroup = document.getElementById('trx-group');
      const trxInput = document.getElementById('transactionId');

      if (method === 'CBE') {
        detailsBox.style.display = 'block';
        detailsBox.innerHTML = "<b>የንግድ ባንክ አካውንት:</b> 1000xxxxxxxxx (ማክቤል ካሰዬ)<br>ገንዘቡን ከላኩ በኋላ የሚመጣውን ትክክለኛ የትራንዛክሽን ቁጥር (ለምሳሌ: FT...) ያስገቡ።";
        trxGroup.style.display = 'block';
        trxInput.required = true;
      } else if (method === 'Telebirr') {
        detailsBox.style.display = 'block';
        detailsBox.innerHTML = "<b>የቴሌብር ቁጥር:</b> 09xxxxxxxx (Allmart Supermarket)<br>የቴሌብር ክፍያ ማረጋገጫ ቁጥርዎን ከታች ያስገቡ።";
        trxGroup.style.display = 'block';
        trxInput.required = true;
      } else if (method === 'Cash') {
        detailsBox.style.display = 'block';
        detailsBox.innerHTML = "እቃው ቤትዎ ሲደርስ ክፍያውን በቀጥታ ለላኪው በጥሬ ገንዘብ መፈጸም ይችላሉ።";
        trxGroup.style.display = 'none';
        trxInput.required = false;
        trxInput.value = "";
      } else {
        detailsBox.style.display = 'none';
        trxGroup.style.display = 'none';
        trxInput.required = false;
        trxInput.value = "";
      }
    }

    document.getElementById('orderForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const paymentMethod = document.getElementById('paymentMethod').value;
      const trxId = document.getElementById('transactionId').value.trim();

      // የትራንዛክሽን ቁጥሩ ትክክለኛ መሆኑን ማረጋገጫ (Validation)
      if (paymentMethod === 'CBE' || paymentMethod === 'Telebirr') {
        // ቁጥሩ ባዶ ከሆነ ወይም ከ 8 ፊደል/ቁጥር በታች ከሆነ ውድቅ ያደርገዋል
        if (trxId.length < 8) {
          alert("ስህተት! ያስገቡት የክፍያ ማረጋገጫ (Transaction ID) ትክክለኛ አይደለም። እባክዎ ትክክለኛውን የባንክ ወይም የቴሌብር ረጅም ቁጥር ያስገቡ።");
          document.getElementById('transactionId').focus();
          return;
        }
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = "በመላክ ላይ...";
      submitBtn.disabled = true;

      const orderData = {
        productName: productName,
        unitPrice: unitPrice,
        quantity: parseInt(document.getElementById('quantity').value),
        totalPrice: parseFloat(document.getElementById('total-price').innerText),
        fullName: document.getElementById('fullName').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        paymentMethod: paymentMethod,
        transactionId: trxId ? trxId : "Cash on Delivery",
        orderDate: new Date().toLocaleString()
      };

      try {
        const response = += await fetch(`${DATABASE_URL}/orders.json`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });
        
        // (ማስታወሻ: የቀጥታ ትክክለኛ የ fetch ትዕዛዝ)
        const resCheck = await fetch(`${DATABASE_URL}/orders.json`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });

        if (resCheck.ok) {
          alert("ትዕዛዝዎ እና የክፍያ ማረጋገጫዎ በተሳካ ሁኔታ ተመዝግቧል! እናመሰግናለን።");
          window.location.href = "index.html";
        } else {
          alert("ትዕዛዙን መላክ አልተቻለም። እባክዎ እንደገና ይሞክሩ።");
          submitBtn.innerText = "ትዕዛዙን ይላኩ";
          submitBtn.disabled = false;
        }
      } catch (error) {
        console.error("Error:", error);
        alert("የኔትወርክ ችግር አጋጥሟል።");
        submitBtn.innerText = "ትዕዛዙን ይላኩ";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
