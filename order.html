<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>እቃ ማዘዣ - Allmart Supermarket</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f8; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .order-card { background: white; max-width: 450px; width: 100%; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { margin-bottom: 20px; text-align: center; color: #1a252f; }
    .summary { background: #e8f5e9; border-left: 4px solid #28a745; padding: 12px; margin-bottom: 20px; border-radius: 4px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
    .btn { width: 100%; padding: 11px; background: #28a745; color: white; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }
    .back { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; }
    #msg { margin-top: 12px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

  <div class="order-card">
    <h2>የእቃ ማዘዣ ፎርም</h2>
    <div class="summary">
      <p><strong>እቃ፦</strong> <span id="item-name">...</span></p>
      <p><strong>ዋጋ፦</strong> <span id="item-price">0</span> ብር</p>
    </div>

    <form id="order-form">
      <div class="form-group">
        <label>ሙሉ ስም</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label>ስልክ ቁጥር</label>
        <input type="tel" id="phone" required>
      </div>
      <div class="form-group">
        <label>አድራሻ (ቦታ)</label>
        <textarea id="address" rows="2" required></textarea>
      </div>
      <button type="submit" class="btn">ትዕዛዙን ላክ</button>
    </form>
    <div id="msg"></div>
    <a href="index.html" class="back">⬅️ ወደ ዋናው ገጽ ተመለስ</a>
  </div>

  <script>
    const DATABASE_URL = "https://allmart-shop-c5301-default-rtdb.firebaseio.com";
    const urlParams = new URLSearchParams(window.location.search);
    const pName = decodeURIComponent(urlParams.get('name') || 'ያልተወሰነ');
    const pPrice = urlParams.get('price') || '0';

    document.getElementById('item-name').innerText = pName;
    document.getElementById('item-price').innerText = pPrice;

    document.getElementById('order-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.style.color = "blue";
      msg.innerText = "እየላከ ነው...";

      const order = {
        productName: pName,
        price: pPrice,
        customerName: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        date: new Date().toLocaleString()
      };

      try {
        const res = await fetch(`${DATABASE_URL}/orders.json`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(order)
        });
        if (res.ok) {
          msg.style.color = "green";
          msg.innerText = "✅ ትዕዛዝዎ በስኬት ተልኳል!";
          document.getElementById('order-form').reset();
        }
      } catch (err) {
        msg.style.color = "red";
        msg.innerText = "❌ አልተላከም። ድጋሚ ይሞክሩ።";
      }
    });
  </script>
</body>
</html>
